name: release

# Builds the installers on every push to main (as workflow artifacts) and publishes them as a
# GitHub Release when a tag like v0.2.0 is pushed. The tag must match the version in Cargo.toml.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Read version
        shell: bash
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\windows\screentint.iss'
      - name: Portable zip
        run: Compress-Archive -Path target\release\ScreenTint.exe -DestinationPath "dist\ScreenTint-$env:VERSION-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Package .app and .dmg
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          bash packaging/macos/build-dmg.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libwayland-dev libgtk-3-dev libxdo-dev
      - name: Build
        run: cargo build --release
      - name: Package .deb and .tar.gz
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          mkdir -p dist
          cargo install cargo-deb --locked
          cargo deb --no-build --output "dist/ScreenTint-${VERSION}-linux-amd64.deb"
          stage="ScreenTint-${VERSION}-linux-x86_64"
          mkdir -p "$stage"
          cp target/release/ScreenTint "$stage/screentint"
          cp packaging/linux/screentint.desktop packaging/linux/install.sh "$stage/"
          cp assets/icon.png "$stage/screentint.png"
          chmod +x "$stage/install.sh"
          cp LICENSE "$stage/"
          tar -czf "dist/${stage}.tar.gz" "$stage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against Cargo.toml
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
            --notes "Binaries are unsigned. See the README for installation and first-run notes."
