[package]
name = "screentint"
description = "Screen tint, dimming and monitor brightness control that lives in your tray"
license = "MIT"
version = "0.2.0"
edition = "2021"

[dependencies]
slint = { version = "1.18", default-features = false, features = [
  "std", "compat-1-2", "compat-1-18", "backend-winit", "renderer-software",
  "system-tray", "unstable-winit-030",
] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
global-hotkey = "0.9"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Registry",
  "Win32_Devices_Display",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Magnification",
  "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

[[bin]]
name = "ScreenTint"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
name = "screentint"
maintainer = "tulerws <tulerws@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "ddcutil"
extended-description = "Applies a per-channel colour multiplier to the whole screen (RandR gamma on X11), a software dimmer, and hardware brightness control over DDC/CI and sysfs backlight. Runs in the system tray."
assets = [
  ["target/release/ScreenTint", "usr/bin/screentint", "755"],
  ["packaging/linux/screentint.desktop", "usr/share/applications/screentint.desktop", "644"],
  ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/screentint.png", "644"],
  ["LICENSE", "usr/share/doc/screentint/copyright", "644"],
]
